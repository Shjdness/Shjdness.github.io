name: RSSHub Sync

on:
  workflow_dispatch:
  schedule:
    # Singapore 07:00, 11:00, 14:00 and 17:00 (UTC+8).
    - cron: '0 3,6,9,23 * * *'

concurrency:
  group: rsshub-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start temporary RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --name rsshub --memory=1g -p 1200:1200 \
            -e NODE_ENV=production \
            -e CACHE_TYPE=memory \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            ghcr.io/diygod/rsshub:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:1200/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs rsshub
          exit 1

      - name: Fetch and store subscribed sources
        env:
          RSS_SYNC_ENDPOINT: ${{ vars.RSS_SYNC_ENDPOINT }}
          RSS_SYNC_TOKEN: ${{ secrets.RSS_SYNC_TOKEN }}
        run: node scripts/rsshub-sync.mjs

      - name: Show RSSHub logs on failure
        if: failure()
        run: docker logs --tail 200 rsshub
