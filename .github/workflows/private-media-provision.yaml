name: Prepare dedicated private R2 bucket

on:
  push:
    branches: [ops/private-media-provision]

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'Shjdness/Shjdness.github.io' && github.ref == 'refs/heads/ops/private-media-provision' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Diagnose private bucket availability without changes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PRIVATE_MEDIA_R2_BUCKET: rin-private-media
        run: |
          if ! result=$(node scripts/private-media-bucket.mjs 2>&1); then
            printf '::error::%s\n' "$result"
            exit 1
          fi
          printf '%s\n' "$result"
