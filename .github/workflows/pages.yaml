name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_URL: https://rin-server.1322589722.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Rin backend
        run: |
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$API_URL/")" = "Hi"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$API_URL/feed?page=1&limit=1" > /dev/null
          oauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Referer: https://shjdness.github.io/' "$API_URL/user/github")"
          case "$oauth_status" in
            301|302|303|307|308) ;;
            *) echo "GitHub OAuth entry returned HTTP $oauth_status" >&2; exit 1 ;;
          esac

      - name: Check Rin server types
        run: bunx tsc --noEmit --project server/tsconfig.json

      - name: Build Rin frontend
        run: bun run b
        env:
          AVATAR: https://raw.githubusercontent.com/Shjdness/Blog/master/lemon.png
          DESCRIPTION: Hasta que Llegue la Muerte
          NAME: Shjdshy
          PAGE_SIZE: "5"

      - name: Add single-page-app fallback
        run: cp client/dist/index.html client/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
