name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Rin frontend
        run: bun run b
        env:
          API_URL: https://rin-server.1322589722.workers.dev
          AVATAR: https://raw.githubusercontent.com/Shjdness/Blog/master/lemon.png
          DESCRIPTION: Hasta que Llegue la Muerte
          NAME: Shjdshy
          PAGE_SIZE: "5"

      - name: Add single-page-app fallback
        run: cp client/dist/index.html client/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
