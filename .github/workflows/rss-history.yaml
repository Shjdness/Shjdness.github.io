name: RSS History
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: youtube-sync
  cancel-in-progress: false
jobs:
  history:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the current trusted main script even if GitHub delivers an old
          # deployment-completed event late. The importer checks API capability.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Create restore bookmark before historical import
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_NAME: ${{ vars.DB_NAME }}
        run: |
          bun install --frozen-lockfile
          bunx wrangler d1 time-travel info "$DB_NAME"
      - name: Install metadata extractor
        run: python -m pip install 'yt-dlp==2026.10.21'
      - name: Reconcile latest feed before frequency assessment
        continue-on-error: true # History can still recover metadata if a Feed is unavailable.
        env:
          RSS_SYNC_ENDPOINT: ${{ vars.RSS_SYNC_ENDPOINT || 'https://rin-server.1322589722.workers.dev' }}
          RSS_SYNC_TOKEN: ${{ secrets.RSS_SYNC_TOKEN }}
          RSS_SYNC_FAILURE_FILE: ${{ runner.temp }}/rss-feed-failures.json
        run: |
          node scripts/youtube-sync.mjs
          python scripts/rss-feed-fallback.py
      - name: Assess and backfill accessible history
        env:
          RSS_SYNC_ENDPOINT: ${{ vars.RSS_SYNC_ENDPOINT || 'https://rin-server.1322589722.workers.dev' }}
          RSS_SYNC_TOKEN: ${{ secrets.RSS_SYNC_TOKEN }}
        run: python scripts/rss-history.py
