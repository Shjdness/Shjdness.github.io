name: SEO Workflow

on:
  workflow_dispatch:

permissions:
  contents: read
  

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun scripts/audit-runtime.ts

      - name: Set up locked Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          node node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome

      - name: Run script
        env: # Or as an environment variable
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          SEO_BASE_URL: ${{ vars.SEO_BASE_URL }}
          S3_ACCESS_HOST: ${{ vars.S3_ACCESS_HOST }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_CACHE_FOLDER: ${{ vars.S3_CACHE_FOLDER }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
        run: |
          bun scripts/render.ts
