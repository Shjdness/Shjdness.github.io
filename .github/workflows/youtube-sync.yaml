name: YouTube Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *" # Daily, 04:17 Asia/Shanghai (GitHub may delay schedules).

permissions:
  contents: read

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata extractor
        run: |
          python -B scripts/tests/test_rss_transport.py
          python -m pip install 'yt-dlp==2026.10.21'
      - name: Fetch official YouTube feeds
        env:
          RSS_SYNC_ENDPOINT: ${{ vars.RSS_SYNC_ENDPOINT }}
          RSS_SYNC_TOKEN: ${{ secrets.RSS_SYNC_TOKEN }}
          RSS_SYNC_FAILURE_FILE: ${{ runner.temp }}/rss-feed-failures.json
        run: |
          node scripts/youtube-sync.mjs
          python scripts/rss-feed-fallback.py
